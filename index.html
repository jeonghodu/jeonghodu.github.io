<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JEONG HODU</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0d0d;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1000px;
      margin: auto;
      padding: 60px;
    }

    h1 {
      font-size: clamp(60px, 10vw, 130px);
      line-height: 0.9;
      margin: 0;
      letter-spacing: -5px;
    }

    .subtitle {
      margin-top: 30px;
      font-size: 20px;
      color: #999;
      letter-spacing: 2px;
    }

    .line {
      width: 100%;
      height: 1px;
      background: #333;
      margin: 50px 0 30px;
    }

    .links a {
      color: #eee;
      text-decoration: none;
      margin-right: 30px;
      font-size: 16px;
    }

    .links a:hover {
      color: #888;
    }
  </style>
</head>

<body>

  <main>

    <h1>
      JEONG<br>
      HODU
    </h1>

    <div class="subtitle">
        My world
    </div>

    <div class="line"></div>

    <div class="links">
      <a href="#">ABOUT</a>
      <a href="#">WRITING</a>
      <a href="#">PROJECTS</a>
      <a href="#">CONTACT</a>
    </div>

  </main>

</body>
</html>
