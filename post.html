<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JEONG HODU — POST</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0d0d;--panel:#171717;--line:#343434;--ink:#f5f5f5;--muted:#aaa;--accent:#d9bf8c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    a{color:inherit}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
    .wrap{max-width:900px;margin:auto;padding:0 42px}header{border-bottom:1px solid var(--line);padding:27px 0}
    header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .brand{font-size:19px;font-weight:800;letter-spacing:-.04em;text-decoration:none}
    .back{font-size:14px;color:#bbb;text-decoration:none}.back:hover,.text-button:hover{color:var(--accent)}
    main{min-height:70svh;padding-top:80px;padding-bottom:110px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent)}
    h1{font-size:clamp(38px,6vw,68px);line-height:1.15;letter-spacing:-.04em;margin:22px 0;overflow-wrap:anywhere}
    h2{font-size:24px}h3{font-size:21px}p{line-height:1.7;color:var(--muted)}
    .meta{color:#888;font-size:13px}.article-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:17px;color:#ddd;margin:52px 0 75px}
    .comments{border-top:1px solid var(--line);padding-top:22px}.comment{padding:20px 0;border-bottom:1px solid #303030}
    .comment.reply{margin-left:28px;padding-left:18px;border-left:2px solid #444}
    .comment p{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0;color:#ddd}
    .comment-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.comment-head strong{font-size:15px}.comment-head time{font-size:12px;color:#888}
    .list{border-top:1px solid var(--line)}.panel{background:var(--panel);border:1px solid var(--line);padding:24px;margin:24px 0}
    label{display:block;font-size:14px;color:#ccc;margin:16px 0 8px}
    input,textarea{display:block;width:100%;background:#101010;border:1px solid #505050;border-radius:2px;color:var(--ink);padding:12px;outline:none}
    input:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:110px;resize:vertical;line-height:1.6}
    .row,.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1 1 180px}.actions{margin-top:14px}
    .button{background:#f5f5f5;color:#111;border:1px solid #f5f5f5;padding:11px 17px;font-size:14px;font-weight:700}
    .button:hover{background:var(--accent);border-color:var(--accent)}.button.ghost{background:transparent;color:var(--ink);border-color:#606060}
    .button.ghost:hover{color:var(--accent);border-color:var(--accent)}.text-button{background:none;border:0;color:#bbb;padding:4px 0;font-size:13px;text-decoration:underline;text-underline-offset:3px}
    .muted{color:var(--muted)}.form-error{color:#ffaaa3;min-height:1.2em;font-size:13px}.empty{padding:26px 0;color:#999}
    footer{border-top:1px solid var(--line);padding:25px 0 45px;color:#777;font-size:13px}[hidden]{display:none!important}
    @media(max-width:600px){.wrap{padding:0 22px}main{padding-top:55px}.panel{padding:18px}.comment.reply{margin-left:12px}}
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="brand" href="index.html">JEONG HODU</a>
    <a class="back" id="back-top" href="index.html#writing">← 글 목록</a>
  </div></header>
  <main class="wrap">
    <p id="page-error" class="form-error" role="alert"></p>
    <article id="post" hidden>
      <span id="category" class="eyebrow"></span>
      <h1 id="post-title"></h1>
      <p id="post-date" class="meta"></p>
      <div id="post-body" class="article-body"></div>
      <div id="admin-actions" class="actions" hidden>
        <button id="edit-post" class="button ghost" type="button">글 수정</button>
        <button id="delete-post" class="button ghost" type="button">글 삭제</button>
      </div>
      <div id="editor"></div>
      <div id="post-comments" class="comments"></div>
    </article>
  </main>
  <footer><div class="wrap">
    <button id="admin-toggle" class="text-button">관리자 로그인</button>
    <form id="login-form" class="panel" hidden>
      <h2>관리자 로그인</h2>
      <label for="admin-email">이메일</label><input id="admin-email" type="email" autocomplete="username" required>
      <label for="admin-password">비밀번호</label><input id="admin-password" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="button" type="submit">로그인</button></div>
      <p id="login-error" class="form-error" role="alert"></p>
    </form>
  </div></footer>

  <script>
    const SUPABASE_URL = 'https://hlichvobeqkaluwcimod.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_OOeZMF3jXV_A8ydqQS1x7w_Ghih7OhU';
  </script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
  (()=>{
    'use strict';
    const params=new URLSearchParams(location.search);
    const category=params.get('category'), postId=params.get('id');
    const client=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
    let isAdmin=false, currentPost=null;
    const el=(tag,className,content)=>{const node=document.createElement(tag);if(className)node.className=className;if(content!==undefined)node.textContent=content;return node;};
    const button=(label,action,className='text-button')=>{const node=el('button',className,label);node.type='button';node.addEventListener('click',action);return node;};
    const date=value=>new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium'}).format(new Date(value));
    async function rpc(name,args={}){
      if(!client)throw new Error('Supabase 스크립트를 불러오지 못했습니다. 새로고침해 주세요.');
      const {data,error}=await client.rpc(name,args);if(error)throw error;return data;
    }

    async function renderComments(
      target,category,postId=null
    ) {
      target.replaceChildren(
        el('h3','','댓글'),
        el('p','muted',
          '불특정 다수가 볼 수 있습니다. ' +
          '닉네임·비밀번호로 나중에 수정하거나 삭제할 수 있습니다.')
      );

      const list = el('div','list');
      target.append(list);

      try {
        const comments = await rpc('list_comments',{
          p_category:category,
          p_post_id:postId
        });

        target.querySelector('h3').textContent =
          category === 'contact'
            ? `방명록 (${comments.length})`
            : `댓글 (${comments.length})`;

        if(!comments.length) {
          list.append(
            el('p','empty','첫 메시지를 남겨 주세요.')
          );
        }

        const byParent = new Map();
        for(const c of comments) {
          const key = c.parent_id || 0;
          if(!byParent.has(key)) byParent.set(key,[]);
          byParent.get(key).push(c);
        }

        function addChildren(parent,depth=0) {
          for(const c of byParent.get(parent) || []) {
            const card = el(
              'article',
              'comment' + (depth ? ' reply' : '')
            );
            const head = el('div','comment-head');
            head.append(
              el('strong','',c.nickname),
              el('time','',
                date(c.created_at) +
                (c.updated_at !== c.created_at
                  ? ' · 수정됨' : '')
              )
            );
            card.append(head,el('p','',c.body));

            const actions = el('div','actions');
            if(depth === 0) {
              actions.append(
                button('답글',() =>
                  showCommentForm(
                    target,category,postId,c.id,
                    `@${c.nickname} 답글`
                  )
                )
              );
            }
            actions.append(
              button('수정',() =>
                showManageForm(
                  card,c,false,
                  () => renderComments(
                    target,category,postId
                  )
                )
              )
            );
            actions.append(
              button('삭제',() =>
                showManageForm(
                  card,c,true,
                  () => renderComments(
                    target,category,postId
                  )
                )
              )
            );

            card.append(actions);
            list.append(card);
            addChildren(c.id,depth+1);
          }
        }
        addChildren(0);
      } catch(e) {
        list.append(el('p','form-error',e.message));
      }

      target.append(
        button(
          '댓글 남기기',
          () => showCommentForm(
            target,category,postId,null,'새 댓글'
          ),
          'button ghost'
        )
      );
    }

    function showCommentForm(
      target,category,postId,parentId,title
    ) {
      target.querySelector('.comment-form')?.remove();

      const form = el('form','panel comment-form');
      form.append(el('h3','',title));

      const row = el('div','row');
      const nWrap = el('div','grow');
      const pWrap = el('div','grow');
      const nick = el('input');
      const pass = el('input');
      const body = el('textarea');
      const error = el('p','form-error');

      nick.placeholder = '닉네임 (2~24자)';
      nick.required = true;
      nick.maxLength = 24;

      pass.placeholder =
        '수정·삭제용 비밀번호 (8자 이상)';
      pass.type = 'password';
      pass.required = true;
      pass.minLength = 8;
      pass.autocomplete = 'new-password';

      nWrap.append(el('label','','닉네임'),nick);
      pWrap.append(el('label','','비밀번호'),pass);
      row.append(nWrap,pWrap);

      body.placeholder = '메시지 (최대 2000자)';
      body.required = true;
      body.maxLength = 2000;

      const bodyLabel = el('label','','내용');
      bodyLabel.append(body);

      const submit = el('button','button','등록');
      submit.type = 'submit';
      const actions = el('div','actions');
      actions.append(
        submit,
        button('취소',() => form.remove())
      );

      form.append(row,bodyLabel,actions,error);
      target.append(form);
      form.scrollIntoView({
        block:'nearest',behavior:'smooth'
      });
      nick.focus();

      form.addEventListener('submit',async event => {
        event.preventDefault();
        submit.disabled = true;
        error.textContent = '';

        try {
          await rpc('add_comment',{
            p_category:category,
            p_post_id:postId,
            p_parent_id:parentId,
            p_nickname:nick.value.trim(),
            p_password:pass.value,
            p_body:body.value.trim()
          });
          await renderComments(target,category,postId);
        } catch(e) {
          error.textContent = e.message;
          submit.disabled = false;
        }
      });
    }

    function showManageForm(
      card,c,deleting,refresh
    ) {
      card.querySelector('.manage-form')?.remove();

      const form = el('form','panel manage-form');
      form.append(
        el('h3','',
          deleting ? '댓글 삭제' : '댓글 수정'
        )
      );

      const pass = el('input');
      const error = el('p','form-error');
      pass.type = 'password';
      pass.placeholder = isAdmin
        ? '관리자라면 비워도 됩니다'
        : '작성할 때 입력한 비밀번호';
      pass.autocomplete = 'current-password';
      pass.required = !isAdmin;

      const passLabel =
        el('label','','댓글 비밀번호');
      passLabel.append(pass);
      form.append(passLabel);

      let body;
      if(!deleting) {
        body = el('textarea');
        body.value = c.body;
        body.required = true;
        body.maxLength = 2000;
        const label = el('label','','수정 내용');
        label.append(body);
        form.append(label);
      }

      const actions = el('div','actions');
      const submit = el(
        'button','button',
        deleting ? '삭제 확인' : '저장'
      );
      submit.type = 'submit';
      actions.append(
        submit,
        button('취소',() => form.remove())
      );
      form.append(actions,error);
      card.append(form);
      (deleting ? pass : body).focus();

      form.addEventListener('submit',async event => {
        event.preventDefault();
        submit.disabled = true;
        error.textContent = '';

        try {
          const result =
            await rpc('manage_comment',{
              p_id:c.id,
              p_password:pass.value,
              p_body:deleting
                ? null
                : body.value.trim(),
              p_delete:deleting
            });

          if(result === 'ok') {
            await refresh();
          } else {
            error.textContent = ({
              wrong_password:
                '비밀번호가 일치하지 않습니다.',
              locked:
                '비밀번호 오류가 많아 15분 후 다시 시도할 수 있습니다.',
              not_found:
                '댓글을 찾을 수 없습니다.',
              invalid:
                '내용을 확인해 주세요.'
            })[result] || '다시 시도해 주세요.';
            submit.disabled = false;
          }
        } catch(e) {
          error.textContent = e.message;
          submit.disabled = false;
        }
      });
    }



    async function loadPost(){
      if(!['writing','projects'].includes(category)||!/^[1-9]\d*$/.test(postId||''))throw new Error('글 주소가 올바르지 않습니다.');
      const list=await rpc('list_posts',{p_category:category});
      currentPost=list.find(item=>String(item.id)===postId);
      if(!currentPost)throw new Error('글을 찾을 수 없습니다. 목록으로 돌아가 확인해 주세요.');
      document.title=`${currentPost.title} — JEONG HODU`;
      document.querySelector('#back-top').href=`index.html#${category}`;
      document.querySelector('#category').textContent=category.toUpperCase();
      document.querySelector('#post-title').textContent=currentPost.title;
      document.querySelector('#post-date').textContent=date(currentPost.created_at);
      document.querySelector('#post-body').textContent=currentPost.body;
      document.querySelector('#post').hidden=false;
      document.querySelector('#admin-actions').hidden=!isAdmin;
      await renderComments(document.querySelector('#post-comments'),category,currentPost.id);
    }
    async function refreshAdmin(){
      try{isAdmin=!!(await rpc('am_i_admin'));}catch{isAdmin=false;}
      document.querySelector('#admin-actions').hidden=!isAdmin;
      document.querySelector('#admin-toggle').textContent=isAdmin?'관리자 로그아웃':'관리자 로그인';
      document.querySelector('#login-form').hidden=true;
    }
    document.querySelector('#edit-post').addEventListener('click',()=>{
      if(!isAdmin||!currentPost)return;
      const form=el('form','panel');form.append(el('h2','','글 수정'));
      const title=el('input'),body=el('textarea'),error=el('p','form-error');
      title.value=currentPost.title;title.maxLength=120;title.required=true;
      body.value=currentPost.body;body.rows=14;body.maxLength=30000;body.required=true;
      const titleLabel=el('label','','제목'),bodyLabel=el('label','','내용');
      titleLabel.append(title);bodyLabel.append(body);
      const actions=el('div','actions'),submit=el('button','button','수정 저장');submit.type='submit';
      actions.append(submit,button('취소',()=>form.remove()));
      form.append(titleLabel,bodyLabel,actions,error);
      document.querySelector('#editor').replaceChildren(form);title.focus();
      form.addEventListener('submit',async event=>{
        event.preventDefault();submit.disabled=true;error.textContent='';
        try{
          await rpc('save_post',{p_id:currentPost.id,p_category:category,p_title:title.value.trim(),p_body:body.value.trim()});
          form.remove();await loadPost();
        }catch(e){error.textContent=e.message;submit.disabled=false;}
      });
    });
    document.querySelector('#delete-post').addEventListener('click',async()=>{
      if(!isAdmin||!currentPost||!confirm('이 글과 모든 댓글을 삭제할까요? 되돌릴 수 없습니다.'))return;
      try{await rpc('remove_post',{p_id:currentPost.id});location.href=`index.html#${category}`;}
      catch(e){alert(e.message);}
    });
    document.querySelector('#admin-toggle').addEventListener('click',async()=>{
      if(isAdmin){await client.auth.signOut();await refreshAdmin();}
      else{const form=document.querySelector('#login-form');form.hidden=!form.hidden;}
    });
    document.querySelector('#login-form').addEventListener('submit',async event=>{
      event.preventDefault();const form=event.currentTarget,submit=form.querySelector('[type=submit]'),errorBox=form.querySelector('#login-error');
      submit.disabled=true;errorBox.textContent='';
      try{
        if(!client)throw new Error('Supabase 연결을 확인해 주세요.');
        const {error}=await client.auth.signInWithPassword({email:form.querySelector('#admin-email').value,password:form.querySelector('#admin-password').value});
        if(error)throw error;form.querySelector('#admin-password').value='';
        await refreshAdmin();
        if(!isAdmin){await client.auth.signOut();throw new Error('이 계정은 관리자 권한이 없습니다.');}
      }catch(e){errorBox.textContent=e.message;form.hidden=false;}finally{submit.disabled=false;}
    });
    async function init(){
      try{
        await loadPost();
        if(client){const {data}=await client.auth.getSession();if(data.session)await refreshAdmin();}
      }catch(e){document.querySelector('#page-error').textContent=e.message;}
    }
    init();
  })();
  </script>
</body>
</html>
